services:
  postgres:
    image: postgres:16-alpine
    container_name: kpi_reliability_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kpi_reliability}
      POSTGRES_USER: ${POSTGRES_USER:-kpi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpi_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kpi_user} -d ${POSTGRES_DB:-kpi_reliability}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
