# Scheduled run of the live operations track.
#
# Runs daily against the public Wikimedia Pageviews API and commits the resulting reports
# back to the repository, so the commit history doubles as the run history.
#
# Cadence is daily, not monthly: the reporting window is 30 days, but a monitoring system
# that only executes monthly would detect an incident up to 30 days late. Window and
# cadence are separate concerns.
#
# No secrets are required. The API needs no key, and committing back uses the automatic
# GITHUB_TOKEN.

name: Live KPI Monitor

on:
  schedule:
    # 06:15 UTC daily. Wikimedia publishes complete daily totals with a lag, and the
    # pipeline defaults to ending "yesterday", so this window is safely settled.
    # GitHub may delay or drop scheduled runs under load - treat cadence as best effort.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of history to fetch"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # The suite is fully offline, so a red build here means the code broke, never that
        # the upstream API was down.
        run: python -m pytest tests/ -q

      - name: Run live monitoring pipeline
        run: |
          if [ -n "${{ github.event.inputs.lookback_days }}" ]; then
            python scripts/run_live_pipeline.py --lookback-days "${{ github.event.inputs.lookback_days }}"
          else
            python scripts/run_live_pipeline.py
          fi

      - name: Publish run summary
        if: always()
        run: |
          echo "## Live monitoring run" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/live/reports/live_run_summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          summary = json.loads(Path("data/live/reports/live_run_summary.json").read_text())
          quality = summary.get("live_data_quality", {})
          anomalies = summary.get("anomalies_in_window", {})
          rows = [
              ("Date range", f"{summary['date_min']} to {summary['date_max']}"),
              ("Series monitored", summary["series_count"]),
              ("Rows fetched", summary["total_rows_fetched"]),
              ("Rows scored", summary["rows_scored"]),
              ("Fetch coverage", f"{quality.get('coverage_pct')}%"),
              ("Anomalies (combined)", anomalies.get("combined")),
              ("Residual model", summary["residual_model_used"]),
          ]
          print("| Metric | Value |")
          print("| --- | --- |")
          for label, value in rows:
              print(f"| {label} | {value} |")
          PY
          else
            echo "No run summary produced - the pipeline failed before writing output." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reports only. Intermediates in data/live/{processed,raw} are gitignored and
          # regenerable, so they never enter history.
          git add data/live/reports
          if git diff --staged --quiet; then
            echo "No change in live reports; nothing to commit."
          else
            git commit -m "chore: live monitoring run $(date -u +%Y-%m-%d)"
            git push
          fi
